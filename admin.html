<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B6E7A">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>إدارة سُقيا</title>
<style>
/* Admin: passcode gate, then driver list with tabs (pending / approved / blocked) and approve / block / delete actions */
:root{
  --bg:#eef4f3; --surface:#ffffff; --fg:#14262b; --muted:#5d6f74; --line:#d7e3e1;
  --brand:#0b6e7a; --brand-fg:#f3fbfb; --ok:#1f9d55; --bad:#c0392b;
  --body:-apple-system,"SF Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1719; --surface:#142226; --fg:#e7f1f0; --muted:#97aaae; --line:#22363a; --brand:#1593a3; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1719; --surface:#142226; --fg:#e7f1f0; --muted:#97aaae; --line:#22363a; --brand:#1593a3; color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
.wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 40px)}
h1{font-size:1.4rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);margin:0 0 16px;line-height:1.6}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.fld{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:1.05rem var(--body);padding:12px;margin:8px 0 12px}
.btn{border:0;border-radius:12px;background:var(--brand);color:var(--brand-fg);font:800 .95rem var(--body);padding:11px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.full{width:100%;padding:14px}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 12px;position:sticky;top:0;padding:8px 0;background:var(--bg);z-index:2}
.tabs button{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 4px;font:700 .88rem var(--body);cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.tabs b{display:block;font-size:1.15rem}
.drv{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.drv h3{margin:0 0 6px;font-size:1.05rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.row{font-size:.88rem;line-height:1.8;color:var(--fg)} .row b{color:var(--muted);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts .btn{flex:1 1 auto;min-width:0}
a.wa{color:#1f9d55;font-weight:800;text-decoration:none;direction:ltr;display:inline-block}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:16px;line-height:1.8}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 20px);left:50%;transform:translate(-50%,30px);background:#14262b;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" hidden>
    <h1>🔐 إدارة سُقيا</h1>
    <p class="sub" id="gateSub"></p>
    <div class="card">
      <label for="pass" style="font-weight:800">رمز المدير</label>
      <input class="fld" id="pass" type="password" autocomplete="current-password" dir="ltr">
      <button class="btn full" type="button" id="gateBtn"></button>
    </div>
  </div>

  <div id="panel" hidden>
    <div class="top">
      <div><h1>🚛 سواقين سُقيا</h1><p class="sub">وافق على السواقين الجدد عشان يظهرون للزبائن.</p></div>
      <button class="btn ghost" type="button" id="reload" aria-label="تحديث">↻</button>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" data-t="pending"><b id="cPending">0</b>بانتظار الموافقة</button>
      <button type="button" data-t="approved"><b id="cApproved">0</b>معتمدين</button>
      <button type="button" data-t="blocked"><b id="cBlocked">0</b>موقوفين</button>
    </div>
    <div id="list"></div>
    <p style="text-align:center;margin-top:20px"><button class="btn ghost" type="button" id="logout">خروج</button></p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const SB = window.SUQYA_SB || {};
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2600); }
async function rpc(fn, args){
  let r;
  try{ r = await fetch(SB.url + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey:SB.key, 'Content-Type':'application/json' }, body:JSON.stringify(args || {}) }); }
  catch(e){ throw new Error('ما فيه اتصال بالإنترنت'); }
  const t = await r.text(); let j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok) throw new Error((j && j.message) || 'صار خطأ');
  return j;
}
const ss = { get(){ try{ return sessionStorage.getItem('suqya-admin') || ''; }catch(e){ return ''; } }, set(v){ try{ v ? sessionStorage.setItem('suqya-admin', v) : sessionStorage.removeItem('suqya-admin'); }catch(e){} } };
let PASS = ss.get(), ROWS = [], TAB = 'pending', CLAIM = false;
const TYPES = { drink:'شرب', use:'استخدام' };
const areaText = a => a.map(x => x.startsWith('gov:') ? 'كل ' + x.slice(4) : x).join('، ');
const fmtDate = d => new Date(d).toLocaleString('ar-OM-u-nu-latn', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });

function showGate(){
  $('panel').hidden = true; $('gate').hidden = false;
  $('gateSub').textContent = CLAIM ? 'أول مرة: اختار رمز سري للمدير (6 أحرف أو أرقام على الأقل) واحفظه عندك. ما أحد يقدر يدخل هنا بدونه.' : 'اكتب رمز المدير.';
  $('gateBtn').textContent = CLAIM ? '✅ احفظ الرمز وادخل' : 'دخول';
  $('pass').autocomplete = CLAIM ? 'new-password' : 'current-password';
  $('pass').focus();
}
async function load(){
  try{ ROWS = await rpc('admin_list', { p_pass:PASS }) || []; }
  catch(e){ toast(e.message); PASS = ''; ss.set(''); showGate(); return false; }
  $('gate').hidden = true; $('panel').hidden = false; paint(); return true;
}
function paint(){
  const n = s => ROWS.filter(r => r.status === s).length;
  $('cPending').textContent = n('pending'); $('cApproved').textContent = n('approved'); $('cBlocked').textContent = n('blocked');
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === TAB));
  const box = $('list'); box.replaceChildren();
  const rows = ROWS.filter(r => r.status === TAB);
  if(!rows.length){ const e = document.createElement('div'); e.className = 'empty'; e.textContent = { pending:'ما فيه تسجيلات جديدة 👌', approved:'ما فيه سواقين معتمدين للحين.', blocked:'ما فيه أحد موقوف.' }[TAB]; box.append(e); return; }
  rows.forEach(r => {
    const el = document.createElement('article'); el.className = 'drv';
    const h = document.createElement('h3'); h.textContent = r.name;
    const p1 = document.createElement('span'); p1.className = 'pill'; p1.textContent = fmtDate(r.created_at); h.append(p1);
    if(r.status === 'approved'){ const p2 = document.createElement('span'); p2.className = 'pill'; p2.textContent = r.available ? '🟢 متوفر' : '🔴 مشغول'; h.append(p2); }
    const line = (k, v, node) => { const d = document.createElement('div'); d.className = 'row'; const b = document.createElement('b'); b.textContent = k + ': '; d.append(b, node || document.createTextNode(v)); return d; };
    const wa = document.createElement('a'); wa.className = 'wa'; wa.href = 'https://wa.me/' + r.phone; wa.textContent = '+' + r.phone; wa.target = '_blank'; wa.rel = 'noopener';
    const prices = Object.keys(r.prices).sort((a, b) => a - b).map(k => (+k).toLocaleString('en') + ' جالون = ' + (+r.prices[k]) + ' ر.ع').join(' · ');
    el.append(h, line('الواتساب', '', wa), line('المناطق', areaText(r.areas)), line('النوع', r.types.map(t => TYPES[t] || t).join(' + ')), line('الأسعار', prices));
    if(r.note) el.append(line('ملاحظة', r.note));
    const acts = document.createElement('div'); acts.className = 'acts';
    const btn = (txt, cls, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + cls; b.textContent = txt; b.onclick = async () => { b.disabled = true; try{ await fn(); await load(); }catch(e){ toast(e.message); } b.disabled = false; }; acts.append(b); };
    const set = (s, msg) => async () => { await rpc('admin_set_status', { p_pass:PASS, p_id:r.id, p_status:s }); toast(msg); };
    if(r.status !== 'approved') btn('✅ موافقة', 'ok', set('approved', 'تمت الموافقة — صار ظاهر للزبائن'));
    if(r.status !== 'blocked') btn('⛔ إيقاف', 'bad', set('blocked', 'انوقف — ما عاد يظهر للزبائن'));
    btn('🗑️ حذف', 'ghost', async () => { if(!confirm('حذف «' + r.name + '» نهائيًا؟')) throw new Error('انلغى'); await rpc('admin_delete', { p_pass:PASS, p_id:r.id }); toast('انحذف'); });
    el.append(acts); box.append(el);
  });
}
$('tabs').onclick = e => { const b = e.target.closest('button'); if(b){ TAB = b.dataset.t; paint(); } };
$('reload').onclick = () => load().then(ok => ok && toast('تحدّثت القائمة'));
$('logout').onclick = () => { PASS = ''; ss.set(''); CLAIM = false; showGate(); };
$('pass').addEventListener('keydown', e => { if(e.key === 'Enter') $('gateBtn').click(); });
$('gateBtn').onclick = async () => {
  const v = $('pass').value; if(!v){ toast('اكتب الرمز'); return; }
  $('gateBtn').disabled = true;
  try{
    if(CLAIM){ await rpc('admin_claim', { p_pass:v }); CLAIM = false; toast('انحفظ رمز المدير ✅'); }
    PASS = v; ss.set(v); $('pass').value = ''; await load();
  }catch(e){ toast(e.message); }
  $('gateBtn').disabled = false;
};
(async () => {
  if(!SB.url || !SB.key){ $('gate').hidden = false; $('gateSub').textContent = 'قاعدة البيانات ما انربطت للحين (config.js).'; $('gateBtn').hidden = true; $('pass').hidden = true; return; }
  try{ CLAIM = !(await rpc('admin_state')).claimed; }catch(e){ toast(e.message); }
  if(PASS && !CLAIM){ if(await load()) return; }
  showGate();
})();
</script>
</body>
</html>
