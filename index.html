<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سُقيا">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>سُقيا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
/* Layout: one-screen mobile app, sticky header, scrolling body, fixed bottom tabs. Water-stone palette from Omani falaj channels. */
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --fg:#10292E; --muted:#5E7579; --line:#D3E0DF;
  --accent:#0B6E7A; --accent-ink:#FFFFFF; --soft:#DCEDEE; --sand:#C9A66B;
  --ok:#2E8B57; --warn:#C2861B; --bad:#B8443A;
  --display:"Reem Kufi","Readex Pro",Tahoma,sans-serif;
  --body:"Readex Pro",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1A1D; --surface:#12262A; --fg:#E4EFEE; --muted:#8FA6A9; --line:#22393D;
  --accent:#3FB6C3; --accent-ink:#06191C; --soft:#173539; --sand:#D8B87E;
  --ok:#5BC48A; --warn:#E3A945; --bad:#E07468; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A1D; --surface:#12262A; --fg:#E4EFEE; --muted:#8FA6A9; --line:#22393D;
  --accent:#3FB6C3; --accent-ink:#06191C; --soft:#173539; --sand:#D8B87E;
  --ok:#5BC48A; --warn:#E3A945; --bad:#E07468; color-scheme:dark}
[hidden]{display:none!important}
@media (max-width:430px){header .brand small{display:none}header .brand h1{font-size:23px}}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-size:26px;margin:0;color:var(--accent);line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px}
.role{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.role button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.role button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{padding:0 16px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-size:20px;margin:6px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.hero{background:radial-gradient(120% 90% at 30% 0%,color-mix(in srgb,var(--accent) 70%,#fff) 0%,var(--accent) 45%,color-mix(in srgb,var(--accent) 55%,#000) 100%);color:#fff;border-radius:24px;padding:0 18px 18px;position:relative;overflow:hidden;box-shadow:0 18px 34px -18px color-mix(in srgb,var(--accent) 80%,#000),inset 0 1px 0 rgba(255,255,255,.35)}
.hero h2{margin:0;font-size:22px}
.hero p{margin:4px 0 12px;opacity:.85;font-size:14px}
.stage{height:210px;margin:0 -18px;position:relative;touch-action:pan-y}
.stage canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage .hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;opacity:.7;pointer-events:none}
.stage .fallback{position:absolute;inset:0;display:grid;place-items:center}
.sup,.prod,.card,.stat{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0);transition:transform .25s ease,box-shadow .25s ease;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 22px -14px rgba(8,40,46,.45)}
.sup.lift,.prod.lift{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 20px 30px -16px rgba(8,40,46,.55)}
.logo{background-image:linear-gradient(150deg,rgba(255,255,255,.4),rgba(255,255,255,0) 45%,rgba(0,0,0,.28));box-shadow:inset 0 2px 2px rgba(255,255,255,.35),inset 0 -4px 6px rgba(0,0,0,.25),0 6px 12px -6px rgba(0,0,0,.5);text-shadow:0 2px 3px rgba(0,0,0,.35)}
.prod .ic{background:radial-gradient(circle at 35% 25%,color-mix(in srgb,var(--soft) 40%,#fff),var(--soft) 55%,color-mix(in srgb,var(--accent) 25%,var(--soft)));box-shadow:inset 0 -3px 6px color-mix(in srgb,var(--accent) 20%,transparent),0 6px 12px -8px rgba(0,0,0,.4)}
.prod .ic svg{filter:drop-shadow(0 3px 2px color-mix(in srgb,var(--accent) 45%,transparent))}
.btn,.qty button.add,.cartbar button{box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000),0 10px 18px -10px rgba(0,0,0,.5);transition:transform .1s,box-shadow .1s}
.cartbar button{box-shadow:0 4px 0 #000,0 14px 24px -10px rgba(0,0,0,.5)}
.btn:active,.qty button.add:active,.cartbar button:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 30%,var(--soft))}
.sec{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.sec .n{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:12px;box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.places{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.place{display:flex;gap:8px;align-items:flex-start;text-align:right;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:10px;position:relative;min-width:0}
.place[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.place .pic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--accent);box-shadow:0 3px 8px -5px rgba(0,0,0,.4)}
.place .pinfo{display:flex;flex-direction:column;min-width:0}
.place .pinfo b{font-size:13px}
.place small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place .pin{position:absolute;top:6px;left:8px;font-size:11px}
.place.add{flex-direction:column;align-items:center;justify-content:center;gap:0;border-style:dashed;color:var(--accent);font-weight:600;font-size:13px;text-align:center}
.maplink{color:var(--accent);font-size:13px;font-weight:500;text-decoration:none}
.paytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:4px;border-radius:14px}
.paytabs button{border:0;background:none;border-radius:10px;padding:9px 4px;font-size:12px;color:var(--muted)}
.paytabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 2px 6px -2px rgba(0,0,0,.25)}
.cc{perspective:1100px;height:196px}
.cc .in{position:relative;max-width:340px;height:100%;margin:0 auto;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.cc.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#0E7F8C 0%,#073F46 55%,#04262A 100%);box-shadow:0 22px 34px -18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.face:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:-90px;top:-120px;background:radial-gradient(circle,rgba(201,166,107,.45),transparent 65%)}
.face.rear{transform:rotateY(180deg);padding:18px 0}
.ctop{display:flex;justify-content:space-between;align-items:center;position:relative}
.chip3{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#E9D29A,#B48D45);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.brand{font-weight:700;font-size:15px;letter-spacing:.5px}
.cnum{direction:ltr;text-align:left;font-size:20px;letter-spacing:2px;font-variant-numeric:tabular-nums;text-shadow:0 2px 3px rgba(0,0,0,.4);position:relative}
.cbot{display:flex;justify-content:space-between;gap:10px;position:relative;direction:ltr}
.cbot div{display:flex;flex-direction:column;min-width:0}
.cbot small,.cvvbox small{font-size:9px;opacity:.7;letter-spacing:1px}
.cbot span{font-size:13px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{height:40px;background:#0b0f10;margin-top:6px}
.cvvbox{margin:0 18px;align-self:flex-end;background:#fff;color:#111;border-radius:6px;padding:4px 12px;direction:ltr;display:flex;gap:10px;align-items:center}
.rnote{margin:0 18px;font-size:11px;opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
.bank{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.acct{font-variant-numeric:tabular-nums;font-weight:600;flex:1;text-align:left}
.upload{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;cursor:pointer;color:var(--accent);font-weight:500}
.upload img{max-height:160px;border-radius:10px;margin:0 auto;display:block}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.ptypes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ptypes button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.ptypes button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--soft);font-weight:600}
.locrow{display:flex;gap:8px}
.locrow input{flex:1;min-width:0}
.lochint{font-size:12px;color:var(--muted);margin-top:6px}
.lochint a{color:var(--accent)}
.lochint.ok{color:var(--ok);font-weight:500}
.locline{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--muted)}
.locline svg{flex:none;margin-top:2px;color:var(--accent)}
.rcpt{max-height:120px;border-radius:10px;align-self:flex-start;border:1px solid var(--line)}
.x2{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%}
#pform{padding-top:18px;max-height:92vh;overflow:auto}
.role button{padding:6px 10px}
.brands{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.bchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;width:76px;font-size:11px;color:var(--muted);text-align:center}
.bchip .logo{width:56px;height:56px;border-radius:50%;font-size:20px;outline:2px solid transparent;outline-offset:3px;transition:outline-color .2s}
.bchip[aria-pressed="true"]{color:var(--fg);font-weight:600}
.bchip[aria-pressed="true"] .logo{outline-color:var(--accent)}
.factory{background:linear-gradient(135deg,color-mix(in srgb,var(--sand) 22%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.factory .row b{font-size:17px}
.moq{font-size:11px;color:var(--warn)}
.chain{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.chain b{color:var(--accent);font-weight:600}
.card.dist{flex-direction:row;gap:12px;align-items:center}
.dist .info{flex:1;min-width:0}
.prod button.ic{border:0;padding:0;position:relative}
.prod button.ic:after{content:"3D";position:absolute;bottom:-5px;left:-5px;background:var(--fg);color:var(--bg);font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px}
.prod .nm{border:0;background:none;padding:0;text-align:right;font-weight:600}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,18,21,.55);backdrop-filter:blur(4px)}
.sheet .panel{width:100%;max-width:560px;background:var(--surface);border-radius:26px 26px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.view{height:300px;margin:0 -16px;border-radius:26px 26px 0 0;background:radial-gradient(90% 80% at 50% 30%,color-mix(in srgb,var(--accent) 40%,var(--surface)),color-mix(in srgb,var(--accent) 12%,var(--surface)) 70%);position:relative;touch-action:none}
.view canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.view .x{position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);font-size:18px;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.view .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}
.sheet .row b{font-size:18px}
.track div.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 60%,#fff),var(--accent));box-shadow:0 2px 4px -1px var(--accent)}
.hero select{width:100%;border:0;border-radius:12px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:flex;flex-direction:column;gap:10px}
.sup{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:right;width:100%}
.logo{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff}
.sup .info{flex:1;min-width:0}
.sup b{display:block;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:500}
.tag.closed{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.back{border:0;background:none;color:var(--accent);padding:0;font-size:14px;align-self:flex-start}
.prod{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.prod .ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.prod .ic svg{width:28px;height:28px;fill:var(--accent)}
.prod .info{flex:1;min-width:0}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.price small{font-weight:400;color:var(--muted);font-size:11px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
.qty button.add{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qty span{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.cartbar{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:0 16px;z-index:6}
.cartbar button{max-width:528px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--fg);color:var(--bg);border-radius:16px;padding:14px 18px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.row.total{border-top:1px dashed var(--line);padding-top:10px;font-weight:600}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 4px;font-size:12px}
.slots button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:13px;font-weight:600;width:100%}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.order{display:flex;flex-direction:column;gap:8px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.track div{height:5px;border-radius:3px;background:var(--line)}
.track div.on{background:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center}
.steps .on{color:var(--fg);font-weight:500}
.pill{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.p-new{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.p-way{background:color-mix(in srgb,var(--sand) 25%,transparent);color:var(--fg)}
.p-done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.p-x{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-family:var(--body)}
.stat span{font-size:11px;color:var(--muted)}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:after{right:21px}
.edit{width:84px;padding:6px 8px;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:7}
nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 10px;position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.badge{position:absolute;top:0;left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:20;transition:opacity .3s}
.note{font-size:12px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand">
      <svg width="30" height="36" viewBox="0 0 30 36" aria-hidden="true"><path d="M15 1C15 1 2 16 2 23a13 13 0 0 0 26 0C28 16 15 1 15 1Z" fill="var(--accent)"/><path d="M9 24a6 6 0 0 0 6 6" stroke="var(--accent-ink)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>

 else if(["c-about","c-lead","c-bank","c-acct"].includes(t.id)){C(st.coMe)[{"c-about":"about","c-lead":"lead","c-bank":"bank","c-acct":"acct"}[t.id]]=t.value.trim();save();toast("تم الحفظ");return}
 else if(t.id=="f-rc"){const f=t.files&&t.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);st.receipt=c.toDataURL("image/jpeg",0.7);render()};im.onerror=()=>toast("تعذّرت قراءة الصورة");im.src=rd.result};rd.readAsDataURL(f);return}
 else return;
 save();render();
});
document.addEventListener("input",e=>{
 const t=e.target;if(t.id=="pf-loc"){locHint();return}
 const k=t.dataset.f;if(!k)return;let v=t.value;
 const set=(id,x)=>{const el=$(id);if(el)el.textContent=x};
 if(k=="cn"){v=v.replace(/\D/g,"").slice(0,16);t.value=fmtNum(v);set("#cc-num",fmtNum(v)||"•••• •••• •••• ••••");set("#cc-brand",cardBrand(v))}
 if(k=="ce"){v=v.replace(/\D/g,"").slice(0,4);if(v.length>2)v=v.slice(0,2)+"/"+v.slice(2);t.value=v;set("#cc-exp",v||"MM/YY")}
 if(k=="cv"){v=v.replace(/\D/g,"").slice(0,4);t.value=v;set("#cc-cvv","•".repeat(v.length)||"•••")}
 if(k=="ch")set("#cc-name",v.toUpperCase()||"YOUR NAME");
 st.form[k]=v;
});
document.addEventListener("focusin",e=>{if(e.target.id=="f-cv"){st.flip=true;const c=$("#cc");if(c)c.classList.add("flip")}});
document.addEventListener("focusout",e=>{if(e.target.id=="f-cv"){st.flip=false;const c=$("#cc");if(c)c.classList.remove("flip")}});
document.addEventListener("submit",e=>{
 e.preventDefault();
 if(e.target.id=="co"){
  const pl=db.places.find(p=>p.id==st.placeId);if(!pl){toast("اختر موقع التوصيل");return}
  const F=st.form;
  if(st.pay=="card"){
   const n=(F.cn||"").replace(/\D/g,"");
   if(!luhn(n)){toast("رقم البطاقة غير صحيح");return}
   const m=(F.ce||"").match(/^(\d{2})\/(\d{2})$/);
   if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],1)<=new Date()){toast("تاريخ انتهاء البطاقة غير صحيح");return}
   if(!/^\d{3,4}$/.test(F.cv||"")){toast("أدخل رمز CVV من خلف البطاقة");return}
   if(!(F.ch||"").trim()){toast("أدخل اسم حامل البطاقة");return}
   const b=$("#paybtn");b.disabled=true;b.textContent="جارٍ الدفع…";
   setTimeout(()=>placeOrder(pl,"بطاقة •••• "+n.slice(-4),"paid"),1400);return;
  }
  if(st.pay=="transfer"){if(!st.receipt&&!(F.ref||"").trim()){toast("ارفع إيصال التحويل أو اكتب رقم المرجع");return}placeOrder(pl,"تحويل بنكي","pending");return}
  placeOrder(pl,"نقداً عند الاستلام","cod");return;
 }
 if(e.target.id=="pform"){
  const r=parseLoc($("#pf-loc").value)||{lat:null,lng:null,link:null};
  const id="pl"+Date.now();
  db.places.push({id,type:st.ptype,label:$("#pf-label").value.trim(),area:$("#pf-area").value,addr:$("#pf-addr").value.trim(),contact:$("#pf-contact").value.trim(),phone:$("#pf-phone").value.trim(),lat:r.lat,lng:r.lng,link:r.link});
  st.placeId=id;save();$("#psheet").hidden=true;toast(r.lat!=null||r.link?"تم حفظ الموقع مع اللوكيشن":"تم حفظ الموقع");render();return;
 }
 if(e.target.id=="bco"){
  const c=C(st.bcartCo),ref=($("#b-ref")||{}).value||st.bref||"",dl=($("#b-dl")||{}).value||"";
  if(st.bpay=="transfer"&&!ref.trim()){toast("اكتب رقم مرجع التحويل");return}
  const n=Math.max(0,...db.border.map(o=>+o.id.slice(2)))+1;
  db.border.unshift({id:"W-"+n,cid:c.id,sid:st.me,items:Object.entries(st.bcart).map(([wid,q])=>({wid,q})),status:0,time:"الآن",pay:{transfer:"تحويل بنكي",credit:"آجل 30 يوم",cod:"الدفع عند التسليم"}[st.bpay],ps:{transfer:"pending",credit:"credit",cod:"cod"}[st.bpay],ref:st.bpay=="transfer"?ref.trim():"",deliver:dl});
  st.bcart={};st.bcartCo=null;st.bref="";st.bdeliver="";st.co=null;st.tab="scompanies";save();toast("تم إرسال طلب الجملة W-"+n+" إلى "+c.short);render();window.scrollTo(0,0);return;
 }
 if(e.target.id=="cnp"){
  db.wproducts.push({id:"w"+Date.now(),cid:st.coMe,name:$("#cn-n").value,desc:$("#cn-d").value,icon:$("#cn-i").value,price:parseFloat($("#cn-p").value)||0,moq:parseInt($("#cn-m").value)||1,stock:true});
  save();toast("تمت إضافة منتج الجملة");
 }
 if(e.target.id=="np"){
  db.products.push({id:"p"+Date.now(),sid:st.me,name:$("#np-n").value,desc:$("#np-d").value,icon:$("#np-i").value,price:parseFloat($("#np-p").value)||0,stock:true});
  save();toast("تمت إضافة المنتج");
 }
 render();
});
render();
</script>

</body>
</html>
