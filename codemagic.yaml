# بناء تطبيق سُقيا للآيفون على أجهزة ماك في Codemagic ورفعه إلى TestFlight
workflows:
  suqya-ios:
    name: سُقيا — آيفون
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios-app
    integrations:
      app_store_connect: manakh_asc        # نفس مفتاح App Store Connect حق مناخ وريم
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.salemaljabri.suqya
      node: 20
      xcode: latest
    scripts:
      - name: تثبيت الحزم وتجهيز الملفات
        script: |
          npm install
          npm run build
      - name: إنشاء مشروع iOS
        script: |
          [ -d ios ] || npx cap add ios
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "[0-9,]*";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.1;/g' ios/App/App.xcodeproj/project.pbxproj   # رقم النسخة في المتجر (1.1 = إضافة الإنجليزي)
          [ -f ios/App/Podfile ] && sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/" ios/App/Podfile
          npm run assets
          npx cap sync ios
      - name: إعدادات التطبيق (الاسم، الموقع، اللغات عربي + إنجليزي)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string سُقيا" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string سُقيا تحتاج موقعك عشان ترسله للسايق ويوصلك الصهريج لين باب بيتك — Suqya uses your location to send it to the tanker driver" $PLIST || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ar" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string ar" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string en" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string whatsapp" $PLIST || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST || true
      - name: التوقيع
        script: xcode-project use-profiles
      - name: رقم البناء
        script: |
          cd ios/App
          agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: بناء ملف IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - ios-app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false     # تظهر في TestFlight للمختبرين الداخليين بدون مراجعة

  suqya-android:
    name: سُقيا — أندرويد
    max_build_duration: 45
    instance_type: linux_x2
    working_directory: ios-app
    environment:
      android_signing:
        - suqya_keystore                  # ملف المفتاح اللي ترفعه في Codemagic ← Code signing identities ← Android keystores
      node: 20
      java: 17
    scripts:
      - name: تثبيت الحزم وتجهيز الملفات
        script: |
          npm install
          npm run build
      - name: إنشاء مشروع أندرويد
        script: |
          [ -d android ] || npx cap add android
          npm run assets:android
          npx cap sync android
      - name: الصلاحيات والإصدار والتوقيع
        script: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />|' $M
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $((BUILD_NUMBER + 1))/" $G
          sed -i 's/versionName "[^"]*"/versionName "1.0"/' $G
          cat >> $G <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
      - name: بناء ملف AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - ios-app/android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/bundle/release/*.aab
